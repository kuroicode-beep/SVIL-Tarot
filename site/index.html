     {{ }} 표시는 프로젝트에 맞게 교체. 문구는 아래 I18N 사전(5개 언어)에서 관리하고 HTML엔 data-i18n 키만 둔다. -->
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVIL Tarot — Low-vision friendly tarot learn & AI reading</title>
<meta name="description" content="Learn tarot, practice spreads, and get local AI readings with a high-contrast deck.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%2316161d' stroke='%23b3ddff' stroke-width='3'/></svg>">
<style>
  :root {
    --bg: #0d0d12;
    --surface: #16161d;
    --surface-2: #1f1f2a;
    --border: #3a3a48;
    --border-strong: #6b6b82;
    --text: #f5f5f7;
    --text-sub: #c9c9d4;
    --accent: #7ec8ff;
    --accent-strong: #b3ddff;
    --accent-max: #d6ecff;
    --positive: #7ee2a8;
    --warning: #ffd479;
    --focus: #ffd479;
    /* 강조 버튼용 — 밝은 바탕 대신 짙은 회색 바탕 + 흰 테두리·글자(대비 13.08:1). */
    --primary-surface: #303038;
    --primary-surface-hover: #3d3d47;
    --primary-border: #ffffff;
    /* 로컬 설치 폰트만 — CDN 금지. 없으면 시스템 산세리프로 폴백. */
    --font-ui: "LINESeedKR", "Pretendard", "Malgun Gothic", "맑은 고딕",
               system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Consolas", "Cascadia Mono", ui-monospace, "Malgun Gothic", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-ui); font-size: 18px; line-height: 1.8;
    letter-spacing: 0.02em; word-break: keep-all; overflow-wrap: break-word;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-max); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  code, .mono, .ver { font-family: var(--font-mono); }

  header { border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .bar { display: flex; align-items: center; gap: 16px; min-height: 68px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .brand b { font-weight: normal; font-size: 1.25rem; }
  .ver { color: var(--accent); font-size: 0.85rem; }

  /* 언어 스위처 — 색만이 아니라 밑줄로도 선택 상태 표시 */
  .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .langs button {
    min-height: 50px; padding: 6px 14px; background: transparent; color: var(--text-sub);
    border: 1.5px solid transparent; border-radius: 999px; font-family: inherit; font-size: 0.92rem;
    cursor: pointer; border-bottom: 3px solid transparent;
  }
  .langs button:hover { color: var(--accent-strong); border-color: var(--border-strong); }
  .langs button[aria-current="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); background: var(--surface-2); }

  .hero { padding: 72px 0 56px; text-align: center; }
  .hero h1 { font-size: 2.2rem; margin: 0 0 12px; font-weight: normal; }
  .tagline { font-size: 1.35rem; color: var(--text-sub); margin: 0 auto 36px; max-width: 34em; }
  .cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 12px 28px; border-radius: 12px; border: 2px solid var(--border-strong);
    background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 1.05rem; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  /* 저시력 사용자에게 밝은 바탕 버튼은 눈부심을 일으킨다. 강조는 짙은 회색 바탕 + 흰 테두리·글자로 준다. */
  .btn-primary { background: var(--primary-surface); color: var(--primary-border); border-color: var(--primary-border); }
  .btn-primary:hover { background: var(--primary-surface-hover); color: var(--accent-max); border-color: var(--accent-max); }
  .meta { margin-top: 18px; color: var(--text-sub); font-size: 0.95rem; }
  .meta .mono { color: var(--text); }

  section { padding: 44px 0; border-top: 1px solid var(--border); }
  h2 { font-size: 1.7rem; font-weight: normal; margin: 0 0 8px; color: var(--accent-strong); }
  .sub { color: var(--text-sub); margin: 0 0 28px; }

  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; }
  .card h3 { font-size: 1.35rem; font-weight: normal; margin: 0 0 6px; }
  .card p { margin: 0; color: var(--text-sub); font-size: 0.97rem; }

  .links { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .link-card {
    display: flex; flex-direction: column; gap: 4px; min-height: 56px; padding: 20px 22px;
    background: var(--surface); border: 2px solid var(--border-strong); border-radius: 12px;
    text-decoration: none; color: var(--text);
  }
  .link-card:hover { border-color: var(--accent); color: var(--accent-strong); }
  .link-card span { color: var(--text-sub); font-size: 0.9rem; overflow-wrap: anywhere; }

  /* 후원 — svil-donation-section 스킬과 동일 규격 (QR 이미지만, 계좌 텍스트 금지) */
  .support-card {
    display: flex; gap: 26px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px;
  }
  .qr-frame { background: #fff; border-radius: 12px; padding: 14px; flex: none; line-height: 0; }
  .qr-frame img { display: block; width: 216px; height: 216px; }
  .qr-meta { display: flex; flex-direction: column; gap: 6px; min-width: 220px; flex: 1; }
  .qr-meta b { font-weight: normal; font-size: 1.25rem; color: var(--accent-strong); }
  .qr-meta span { color: var(--text-sub); font-size: 0.97rem; }
  @media (max-width: 560px) { .support-card { justify-content: center; text-align: center; } .qr-meta { align-items: center; } }

  footer { border-top: 1px solid var(--border); padding: 32px 0 48px; color: var(--text-sub); font-size: 0.9rem; text-align: center; }
  /* 표준 푸터 링크 — 협업 문의·블로그·홈페이지(SVIL 공통 상수). 라벨만 번역, 값은 고정. */
  .foot-links { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 0 0 20px; }
  .foot-links .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
  .foot-links .k { color: var(--text-sub); font-size: 0.85rem; min-width: 84px; text-align: right; }
  @media (max-width: 560px) { .foot-links .k { min-width: 0; text-align: center; } }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    .hero { padding: 48px 0 40px; }
    .hero h1 { font-size: 1.8rem; }
    .tagline { font-size: 1.15rem; }
    .btn { width: 100%; }
  }
</style>
</head>

</main>

const LANGS = ["en", "ko", "ja", "zh", "vi"];   // en = 디폴트/폴백

function applyLang(code) {
  const dict = I18N[code] || I18N.en;
  document.documentElement.lang = code;
  document.title = dict._title || I18N.en._title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const val = dict[el.dataset.i18n] ?? I18N.en[el.dataset.i18n];   // 누락 키는 영어로 폴백
    if (val) el.textContent = val;
  });
  document.querySelectorAll(".langs button").forEach(b => {
    b.setAttribute("aria-current", String(b.dataset.lang === code));
  });
  try { localStorage.setItem("site-lang", code); } catch (e) {}
}

function initialLang() {
  try { const s = localStorage.getItem("site-lang"); if (s && LANGS.includes(s)) return s; } catch (e) {}
  for (const pref of navigator.languages || [navigator.language || "en"]) {
    const base = String(pref).toLowerCase().split("-")[0];
    if (LANGS.includes(base)) return base;
  }
  return "en";   // 디폴트 영어
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
applyLang(initialLang());
</script>
