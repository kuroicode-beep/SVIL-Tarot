<style>
        body {
            background-color: #11131b;
            color: #e2e1ed;
        }
        
        .btn-primary {
            background-color: #1C2431;
            border: 2px solid #FFD94A;
            color: #FFD94A;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .btn-primary:focus {
            outline: 3px solid #FFD94A;
            outline-offset: 2px;
        }

        .btn-secondary {
            background-color: #1F1F2A;
            border: 2px solid #6B6B82;
            color: #F5F5F7;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-secondary:focus {
            outline: 3px solid #FFD94A;
            outline-offset: 2px;
        }
        
        .btn-destructive {
            background-color: #1F1F2A;
            border: 2px solid #FF9B9B;
            color: #FF9B9B;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-destructive:focus {
            outline: 3px solid #FFD94A;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-background min-h-screen p-margin-page">
<div class="max-w-7xl mx-auto space-y-stack-lg">
<header class="border-b border-outline-variant pb-stack-md">
<h1 class="font-headline-lg text-headline-lg text-primary">SVIL Tarot UI Kit</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-gap-standard">Component Library &amp; Design System Showcase</p>
</header>
<section class="grid grid-cols-1 lg:grid-cols-2 gap-stack-lg">
<!-- Buttons -->
<div class="bg-surface-container-low rounded-xl border border-outline-variant p-stack-md">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Buttons</h2>
<div class="space-y-stack-md">
<div>
<h3 class="font-interactive-label text-interactive-label text-secondary mb-gap-standard">Primary</h3>
<div class="flex flex-wrap gap-gap-standard">
<button class="btn-primary">Default</button>
<button class="btn-primary hover:bg-[#253041]">Hover</button>
<button class="btn-primary" style="outline: 3px solid #FFD94A; outline-offset: 2px;">Focused</button>
</div>
</div>
<div>
<h3 class="font-interactive-label text-interactive-label text-secondary mb-gap-standard">Secondary</h3>
<div class="flex flex-wrap gap-gap-standard">
<button class="btn-secondary">Default</button>
<button class="btn-secondary hover:bg-[#2A2A38]">Hover</button>
<button class="btn-secondary" style="outline: 3px solid #FFD94A; outline-offset: 2px;">Focused</button>
</div>
</div>
<div>
<h3 class="font-interactive-label text-interactive-label text-secondary mb-gap-standard">Destructive</h3>
<div class="flex flex-wrap gap-gap-standard">
<button class="btn-destructive">Default</button>
<button class="btn-destructive hover:bg-[#2A2A38]">Hover</button>
<button class="btn-destructive" style="outline: 3px solid #FFD94A; outline-offset: 2px;">Focused</button>
</div>
</div>
</div>
</div>
<!-- Chips & Badges -->
<div class="space-y-stack-lg">
<div class="bg-surface-container-low rounded-xl border border-outline-variant p-stack-md">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Chips / Segmented</h2>
<div class="flex flex-wrap gap-gap-standard">
<button class="bg-[#1F1F2A] border-2 border-[#6B6B82] text-[#F5F5F7] px-4 py-2 rounded-full font-tiny text-tiny min-h-[50px] flex items-center">Unselected</button>
<button class="bg-[#1F1F2A] border-2 border-[#FFD94A] text-[#FFD94A] px-4 py-2 rounded-full font-tiny text-tiny min-h-[50px] flex items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span> Selected
                        </button>
<button class="bg-[#1F1F2A] border-2 border-[#6B6B82] text-[#F5F5F7] px-4 py-2 rounded-full font-tiny text-tiny min-h-[50px] flex items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">auto_awesome</span> Option
                        </button>
</div>
</div>
<div class="bg-surface-container-low rounded-xl border border-outline-variant p-stack-md">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md">Status Badges</h2>
<div class="flex flex-wrap gap-gap-standard">
<div class="flex items-center gap-2 bg-[#1F1F2A] border border-[#6B6B82] px-3 py-1.5 rounded-full font-caption text-caption text-[#F5F5F7]">
<div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
                            연결됨
                        </div>
<div class="flex items-center gap-2 bg-[#1F1F2A] border border-[#6B6B82] px-3 py-1.5 rounded-full font-caption text-caption text-[#F5F5F7]">
<div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                            끊김
                        </div>
<div class="flex items-center gap-2 bg-[#1F1F2A] border border-[#6B6B82] px-3 py-1.5 rounded-full font-caption text-caption text-[#F5F5F7]">
<div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                            확인 중
                        </div>
</div>
</div>
</div>
</section>
</div>
