name: svil_tarot
description: "SVIL 타로 — 저시력 친화 타로 학습·실전·AI 리딩"
publish_to: 'none'

# 버전은 SVIL SemVer 규칙을 따른다. MAJOR = 데이터 구조 변경.
# 웹판(v1.8.0)에서 IndexedDB → SQLite로 저장소가 바뀌므로 2.0.0이다.
# 이 값과 lib/version.dart의 APP_VERSION을 항상 같이 맞춘다.
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  yaml: ^3.1.3

flutter:
  uses-material-design: true

  # pubspec은 없는 파일을 선언하면 빌드가 실패한다(웹 @font-face는 조용히 무시했지만 여기는 아니다).
  # 실제로 디스크에 넣은 것만 적는다 — test/assets_test.dart가 이 목록과 디스크를 대조한다.
  assets:
    - assets/deck/
    - assets/data/

  fonts:
    # SVIL 표준 글꼴. id는 웹판 i18n의 fontOptions와 같은 순서를 유지한다.
    # 목록 첫 항목이 기본값이자 알 수 없는 fontId의 폴백이다.
    - family: LINESeedKR
      fonts:
        - asset: assets/fonts/LINESeedKR-Rg.ttf
          weight: 400
    # 나눔고딕만 진짜 Bold 파일이 있다. 웹판은 Bold가 없어 굵은 글씨가 전부 합성이었다.
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: KyoboHandwriting2019
      fonts:
        - asset: assets/fonts/KyoboHandwriting2019.ttf
          weight: 400
    # 맑은 고딕은 Windows 시스템 글꼴이라 번들하지 않고 패밀리명으로 참조한다.
    #
    # 미확보 4종 — 고운돋움 · 카페24동동 · 티머니둥근바람 · 레코.
    # 웹판은 .woff로 갖고 있으나 Flutter는 woff를 못 읽어 TTF/OTF 원본이 필요하다.
    # 파일을 확보하고 재배포 라이선스를 docs/architecture/fonts_20260810_라이선스_ClaudeCode.md에
    # 기록한 뒤에만 여기에 추가한다. 지금 선언하면 빌드가 실패한다.
